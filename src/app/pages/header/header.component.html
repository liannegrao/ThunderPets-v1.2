<header #headerRef class="header">
  <div class="container">
    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <a href="/" class="logo">
        <img ngSrc="/img/THUNDERPETS (4) (1).png" class="logo-img" alt="ThunderPets" width="200" height="50">
        ThunderPets
      </a>
      <!-- Mobile hamburger menu button -->
      <button class="nav-toggle" aria-controls="navCollapse" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen" [class.open]="isMenuOpen">
        <span class="hamburger" aria-hidden="true"></span>
      </button>

      <div id="navCollapse" class="nav-collapse" [class.open]="isMenuOpen">
        <div class="nav-links">
          <a href="#missao" (click)="closeMenu()">Missão</a>
          <a href="#adote" (click)="closeMenu()">Adote</a>
          <a href="#ajude" (click)="closeMenu()">Ajude</a>
        </div>
        <div class="nav-buttons" *ngIf="(currentUser$ | async) as user; else buttonsNoAuth">
          <span class="user-welcome">Olá, {{ user.nome }}</span>
          <a class="button button-secondary" [routerLink]="getPanelRoute(user.role)" (click)="closeMenu()">Painel</a>
          <a *ngIf="user.role === 'doador' || user.role === 'mediador'" class="button button-primary" routerLink="/cadastrar-pet" (click)="closeMenu()">Cadastrar pet</a>
          <button class="btn-outline" (click)="logout(); closeMenu()">Sair</button>
        </div>
        <ng-template #buttonsNoAuth>
          <div class="nav-buttons">
            <button class="btn-outline" (click)="openAuthModal(false); closeMenu()">Entrar</button>
            <button class="button button-primary" (click)="openAuthModal(true); closeMenu()">Cadastrar</button>
          </div>
        </ng-template>
      </div>
    </nav>
  </div>

  <!-- Auth Modal -->
  <app-login
    *ngIf="showAuthModal"
    [startInCadastro]="authStartsAsCadastro"
    (closed)="closeAuthModal()">
  </app-login>
</header>
